<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Arena</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/three/three.module.js",
          "three/addons/": "/three-examples/"
        }
      }
    </script>
  </head>
  <body>
    <main id="overlay">
      <header class="hud-top">
        <div class="stat-block">
          <span class="label">Здоровье</span>
          <div class="health-bar">
            <div class="health-fill" id="healthFill"></div>
          </div>
          <span class="value" id="healthValue">100 HP</span>
        </div>
        <div class="stat-block">
          <span class="label">Оружие</span>
          <span class="value" id="weaponName">—</span>
          <span class="value value--secondary" id="ammoDisplay">—</span>
          <span class="stat-meta hidden" id="reloadIndicator">Перезарядка…</span>
        </div>
        <div class="stat-block">
          <span class="label">Баланс</span>
          <span class="value" id="walletDisplay">$800</span>
          <span class="stat-meta" id="buyZoneHint">Зона закупки недоступна</span>
        </div>
        <div class="stat-block">
          <span class="label">Фраги</span>
          <span class="value" id="scoreDisplay">0</span>
        </div>
      </header>

      <section id="serverStats" class="metrics hidden">
        <div class="metric">
          <span class="metric__label">Ping</span>
          <span class="metric__value" id="pingValue">—</span>
        </div>
        <div class="metric">
          <span class="metric__label">Tick</span>
          <span class="metric__value" id="tickValue">—</span>
        </div>
      </section>

      <section id="buyMenu" class="buy-menu hidden" tabindex="0">
        <header class="buy-menu__header">
          <h2>Меню закупки</h2>
          <p>Доступно только в зоне закупки. Нажмите B для закрытия.</p>
        </header>
        <div id="buyList" class="buy-menu__list"></div>
      </section>

      <div class="feed" id="eventFeed"></div>

      <div class="crosshair" id="crosshair">
        <span class="crosshair-line vertical"></span>
        <span class="crosshair-line horizontal"></span>
      </div>

      <div id="hitMarker" class="hit-marker hidden"></div>

      <div id="startPrompt" class="prompt">
        <h1>Source Arena</h1>
        <p>Нажмите, чтобы подключиться. WASD — движение, ЛКМ — огонь, R — перезарядка, B — закупка.</p>
      </div>

      <div id="connectionStatus" class="status hidden">Подключение…</div>
    </main>

    <canvas id="world"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
