<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Arena</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/three/three.module.js",
          "three/addons/": "/three-examples/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="ui">
      <div id="startOverlay" class="overlay">
        <div class="panel">
          <h1>Source Arena</h1>
          <p>Современный тир в стиле Source. Управление: WASD – движение, Space – прыжок, ЛКМ – огонь, R – перезарядка, B – магазин.</p>
          <button id="playButton" class="primary">Играть</button>
        </div>
      </div>
      <div id="hud" class="hud">
        <div class="hud-left">
          <div class="hud-stat health"><span id="hudHealthValue">100 HP</span></div>
          <div class="hud-stat money"><span id="hudMoney">$800</span></div>
        </div>
        <div class="hud-right">
          <div class="hud-stat ammo"><span id="hudAmmo">0 / 0</span></div>
          <div class="hud-stat score">Фрагов: <span id="hudScore">0</span></div>
          <div class="hud-stat ping">Пинг: <span id="hudPing">—</span></div>
        </div>
      </div>
      <div id="buyPrompt" class="buy-prompt hidden">B — магазин (вы в зоне покупки)</div>
      <div id="killFeed" class="feed"></div>
      <div id="connectionStatus" class="status hidden"></div>
      <div id="crosshair" class="crosshair" data-state="idle">
        <span class="bar top"></span>
        <span class="bar right"></span>
        <span class="bar bottom"></span>
        <span class="bar left"></span>
        <span class="dot"></span>
      </div>
      <div id="hitMarker" class="hit-marker"></div>
      <div id="buyMenu" class="buy-menu hidden" data-ui-interactive="true">
        <div class="buy-header">
          <h2>Покупка оружия</h2>
          <button id="buyClose" class="secondary" type="button" data-ui-interactive="true">Закрыть</button>
        </div>
        <div id="buyList" class="buy-list"></div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app/main.js"></script>
  </body>
</html>
