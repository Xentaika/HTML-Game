<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Arena - Multiplayer</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/three/three.module.js",
          "three/addons/": "/three-examples/"
        }
      }
    </script>
  </head>
  <body>
    <main id="overlay">
      <div class="hud">
        <section class="stat">
          <h2>Health</h2>
          <div class="health-bar">
            <div class="health-fill" id="healthFill"></div>
          </div>
          <p id="healthValue" class="stat-value">100 HP</p>
        </section>
        <section class="stat">
          <h2>Ammo</h2>
          <p id="ammoDisplay" class="stat-value">12 / 60</p>
          <p id="reloadIndicator" class="stat-meta hidden">Перезарядка…</p>
        </section>
        <section class="stat">
          <h2>Kills</h2>
          <p id="scoreDisplay" class="stat-value">0</p>
        </section>
      </div>
      <div class="feed" id="eventFeed"></div>
      <div class="crosshair" id="crosshair">
        <span class="crosshair-line vertical"></span>
        <span class="crosshair-line horizontal"></span>
      </div>
      <div id="hitMarker" class="hit-marker hidden"></div>
      <div id="startPrompt" class="prompt">
        <h1>Neon Arena</h1>
        <p>Нажмите, чтобы присоединиться. W A S D – движение, Space – прыжок, ЛКМ – огонь, R – перезарядка.</p>
      </div>
      <div id="connectionStatus" class="status hidden">Подключение…</div>
    </main>
    <canvas id="world"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
