<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser FPS</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="%23080b10" stroke="%23ffffff" stroke-width="4"/><line x1="32" y1="10" x2="32" y2="54" stroke="%23ffffff" stroke-width="4"/><line x1="10" y1="32" x2="54" y2="32" stroke="%23ffffff" stroke-width="4"/></svg>'
  />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay" class="overlay">
    <h1>Тренировка стрельбы</h1>
    <p>WASD — движение, SPACE — прыжок, SHIFT — ускорение.</p>
    <p>Нажмите, чтобы захватить курсор и начать игру.</p>
  </div>
  <div id="hud" class="hud hidden">
    <div>Здоровье цели: <span id="enemyHealth">100%</span></div>
    <div>Попаданий по телу: <span id="bodyHits">0</span> / 4</div>
    <div>Попаданий в голову: <span id="headHits">0</span> / 1</div>
    <div>Перезарядка: <span id="reload" class="ready">готов</span></div>
  </div>
  <div id="crosshair" class="crosshair hidden">
    <span class="line horizontal"></span>
    <span class="line vertical"></span>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
